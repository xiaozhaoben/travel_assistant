name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: ""
          POSTGRES_HOST: ""
          POSTGRES_DB: ""
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
          AMAP_API_KEY: ""
          AMAP_MAPS_API_KEY: ""
          UNSPLASH_ACCESS_KEY: ""
          PEXELS_API_KEY: ""
          PIXABAY_API_KEY: ""
          WEB_SEARCH_MCP_COMMAND: ""
          LLM_API_KEY: ""
          OPENAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          EMBEDDING_API_KEY: ""
          DASHSCOPE_API_KEY: ""
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_AMAP_WEB_JS_KEY: ${{ vars.VITE_AMAP_WEB_JS_KEY }}
          VITE_AMAP_SECURITY_JS_CODE: ${{ vars.VITE_AMAP_SECURITY_JS_CODE }}
        run: npm run build

      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
