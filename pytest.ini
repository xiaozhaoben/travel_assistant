[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = -q
markers =
    langsmith_eval: optional LangSmith integration evaluations
filterwarnings =
    ignore:Importing Send from langgraph\.constants is deprecated\. Please use 'from langgraph\.types import Send' instead\.:langgraph.warnings.LangGraphDeprecatedSinceV10:trustcall\._base
